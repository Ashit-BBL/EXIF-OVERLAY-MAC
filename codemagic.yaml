workflows:

  exif-overlay-intel-mac:
    name: EXIF Overlay Tool — macOS Intel x86_64
    max_build_duration: 60
    instance_type: mac_mini_m2      # Apple Silicon runner with Rosetta 2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:

      - name: Install x86_64 Python 3.12 from python.org
        script: |
          # python.org installer is universal2 (arm64 + x86_64)
          # Running it under arch -x86_64 gives us a proper Intel Python
          curl -O https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg python-3.12.7-macos11.pkg -target /
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 --version

      - name: Install dependencies (x86_64)
        script: |
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m pip install --upgrade pip
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m pip install -r requirements.txt

      - name: Smoke test
        script: |
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 test_smoke.py

      - name: Build with Nuitka (x86_64)
        script: |
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --include-data-files="ashitg - new2 - White.png=ashitg - new2 - White.png" \
            --macos-create-app-bundle \
            --macos-app-name="EXIF Overlay Tool" \
            --macos-app-version="1.4" \
            --macos-target-arch=x86_64 \
            --output-dir=dist \
            exif_tool.py

      - name: Rename app bundle
        script: |
          mv "dist/exif_tool.app" "dist/EXIF Overlay Tool.app"

      - name: Verify architecture (must show x86_64)
        script: |
          file "dist/EXIF Overlay Tool.app/Contents/MacOS/exif_tool"

      - name: Zip app bundle
        script: |
          cd dist
          zip -r "../EXIF-Overlay-Tool-mac-intel-v1.4.zip" "EXIF Overlay Tool.app"

    artifacts:
      - EXIF-Overlay-Tool-mac-intel-v1.4.zip
