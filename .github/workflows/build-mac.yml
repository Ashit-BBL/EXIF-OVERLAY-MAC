name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

# Use Node.js 24 for all actions (Node.js 20 deprecated, forced from Jun 16 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Job 1: Smoke test (fast — no compilation) ───────────────────────────────
  test:
    name: Smoke Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: python test_smoke.py

  # ── Job 2: Nuitka build (only runs if smoke test passes) ────────────────────
  build-mac:
    name: Build .app (macOS Apple Silicon — M1/M2/M3/M4)
    runs-on: macos-latest
    needs: test                # waits for test job to pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --include-data-files="ashitg - new2 - White.png=ashitg - new2 - White.png" \
            --macos-create-app-bundle \
            --macos-app-name="EXIF Overlay Tool" \
            --macos-app-version="1.3" \
            --output-dir=dist \
            exif_tool.py

      - name: Rename app bundle
        run: mv "dist/exif_tool.app" "dist/EXIF Overlay Tool.app"

      - name: Show architecture
        run: file "dist/EXIF Overlay Tool.app/Contents/MacOS/exif_tool" || true

      - name: Verify .app structure
        run: |
          echo "── App bundle contents ──"
          ls -lh "dist/EXIF Overlay Tool.app/Contents/MacOS/"
          echo "── Checking logo bundled ──"
          find "dist/EXIF Overlay Tool.app" -name "*.png" | head -5

      - name: Zip app bundle
        run: |
          cd dist
          zip -r "../EXIF-Overlay-Tool-mac-v1.3.zip" "EXIF Overlay Tool.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXIF-Overlay-Tool-mac-v1.3
          path: EXIF-Overlay-Tool-mac-v1.3.zip
          retention-days: 90

  # ── Job 3: Screenshot (runs Python source directly — avoids Gatekeeper) ─────
  screenshot:
    name: UI Screenshot (macOS)
    runs-on: macos-latest
    needs: test                  # only needs smoke test, not the full build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Launch app and capture screenshot
        run: |
          # Launch the app in the background
          python exif_tool.py &
          APP_PID=$!
          echo "App launched with PID $APP_PID"

          # Wait for window to fully load and maximise
          sleep 12

          # Capture the full screen
          screencapture -x mac-screenshot.png
          echo "Screenshot captured"

          # Shut down the app cleanly
          kill $APP_PID 2>/dev/null || pkill -f "exif_tool" || true

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: mac-ui-screenshot
          path: mac-screenshot.png
          retention-days: 30
