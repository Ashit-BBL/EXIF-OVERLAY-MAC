name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Nuitka build ─────────────────────────────────────────────────────
      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --include-data-files="ashitg - new2 - White.png=ashitg - new2 - White.png" \
            --macos-create-app-bundle \
            --macos-app-name="EXIF Overlay Tool" \
            --macos-app-version="1.1" \
            --output-dir=dist \
            exif_tool.py

      # ── 5. Rename .app to friendly name ─────────────────────────────────────
      - name: Rename app bundle
        run: |
          mv "dist/exif_tool.app" "dist/EXIF Overlay Tool.app"

      # ── 6. Zip for download ──────────────────────────────────────────────────
      - name: Zip app bundle
        run: |
          cd dist
          zip -r "../EXIF-Overlay-Tool-mac-v1.1.zip" "EXIF Overlay Tool.app"

      # ── 7. Upload artifact ───────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXIF-Overlay-Tool-mac-v1.1
          path: EXIF-Overlay-Tool-mac-v1.1.zip
          retention-days: 90
